name: SpruceSettings
version: '${version}'
main: dev.spruceworks.settings.SpruceSettingsPlugin
api-version: '26.2'
description: Per-player settings GUI with a public toggle API for other plugins.
authors: [SpruceWorks]
website: https://github.com/spruceworks/spruce-settings
softdepend: [PlaceholderAPI]

# Fetched by Paper's library loader on first start, not bundled — bundling it
# adds ~24 MB of per-platform native binaries and breaks marketplace upload
# limits. The first start after installing needs outbound access to Maven
# Central; the driver is then cached under the server's libraries/ folder.
libraries:
  - org.xerial:sqlite-jdbc:${sqliteJdbcVersion}

permissions:
  sprucesettings.use:
    description: Allows opening /settings.
    default: true
  sprucesettings.admin:
    description: Allows /settingsadmin (reload, reset).
    default: op
  sprucesettings.toggle.pvp:
    description: Allows using the PvP protection toggle, when the feature is enabled in config.
    default: true
